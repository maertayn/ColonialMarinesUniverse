- type: antagSpecifier
  id: StrikeOrganizer
  prefRoles: [ StrikeOrganizerRole ]
  jobBlacklistGroup:
  - AllGovforJobs
  - AllOpforJobs
  - AllCLFJobs
  - AllWeYuJobs
  briefing:
    text: strikeorganizer-role-greeting
    color: DarkRed
    sound: "/Audio/Ambience/Antag/headrev_start.ogg"
  startingGear: AU14GearStrikeOrganizer
  startingSkills:
    RMCSkillLeadership: 2
    RMCSkillEndurance: 2
  components:
  - type: StrikeOrganizer
  - type: SynthGunAccess
  mindRoles:
  - MindRoleStrikeOrganizer

- type: entity
  id: StrikeOrganizer
  parent: BaseGameRule
  components:
  - type: GameRule
  - type: StrikeOrganizerRule
    goal: 12
  - type: AntagSelection
    selectionTime: JobsAssigned
    antags:
    - !type:FixedAntagCount
      proto: StrikeOrganizer
      count: 1

# Mid-round conversion target: granted by signing a strike petition. Never round-start selected.
- type: entity
  parent: BaseMindRoleAntag
  id: MindRoleStrikeParticipant
  name: Strike Participant Mind Role
  components:
  - type: MindRole
    antagPrototype: StrikeParticipantRole
    exclusiveAntag: true
    roleType: TeamAntagonist
    subtype: cmu-role-subtype-strike-participant
  - type: CMUAdminRoleIcon
    icon:
      sprite: /Textures/CMU14/Interface/au14colonyjobicons.rsi
      state: colonist

- type: antag
  parent: CMUAntagColonyBase
  id: StrikeParticipantRole
  name: roles-antag-strikeparticipant-name
  objective: roles-antag-strikeparticipant-objective

- type: entity
  parent: BaseMindRoleAntag
  id: MindRoleStrikeOrganizer
  name: Strike Organizer Mind Role
  components:
  - type: MindRole
    antagPrototype: StrikeOrganizerRole
    exclusiveAntag: true
    roleType: SoloAntagonist
    subtype: cmu-role-subtype-strike-organizer
  - type: CMUAdminRoleIcon
    icon:
      sprite: /Textures/CMU14/Interface/au14colonyjobicons.rsi
      state: colonist

- type: antag
  parent: CMUAntagColonyBase
  id: StrikeOrganizerRole
  name: roles-antag-strikeorganizer-name
  setPreference: true
  blacklistedGamemodes:
  - DistressSignal
  objective: roles-antag-strikeorganizer-objective

- type: startingGear
  id: AU14GearStrikeOrganizer
  equipment:
    back: AU14StrikeOrganizerBackpack
    pocket1: CMUStrikePetition
  storage:
    back:
    - AUPaperStrikeOrganizer
    - RMCLighter

- type: entity
  parent: Paper
  id: CMUStrikePetition
  name: strike petition
  description: A petition demanding better conditions. Signing it joins the strike.
  components:
  - type: StrikePetition

# Organizer action: the petition is paper, the strike is not. Redraft after a burn,
# confiscation, or release.
- type: entity
  parent: ActionMarineBase
  id: CMUActionStrikeRedraft
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 60
  - type: Sprite
    layers:
    - sprite: Objects/Misc/bureaucracy.rsi
      state: paper
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:StrikeRedraftActionEvent

- type: entity
  parent: RMCBackpackRTO
  id: AU14StrikeOrganizerBackpack
  name: organizer's radio pack
  description: A radio telephone pack carried by a labor organizer.
  components:
  - type: StorageFill
    contents:
    - id: RMCMegaphone
    - id: RMCSpaceCash1000
      amount: 4
  - type: StrikeOrganizerPack

# Pack action: transmit a one-way communique. No fax machine exists on the organizer's
# side of the wire; sends land at the CMB, replies cannot route back.
- type: entity
  parent: ActionMarineBase
  id: CMUActionStrikeFax
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 30
  - type: Sprite
    layers:
    - sprite: _RMC14/Objects/Tools/megaphone.rsi
      state: megaphone
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:StrikeFaxTransmitActionEvent
